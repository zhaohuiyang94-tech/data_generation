[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt54-data-flywheel"
version = "0.1.0"
description = "Verified GPT-5.4 data flywheel for KaeDe-VQG semantic and compose datasets"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
gpt54-flywheel = "gpt54_data_flywheel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
